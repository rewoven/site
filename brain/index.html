<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewoven Brain</title>
    <link rel="icon" href="../assets/logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!--
      SQL to run in Supabase SQL Editor:
      CREATE TABLE brain_pages (
        id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
        title TEXT NOT NULL UNIQUE,
        content TEXT DEFAULT '',
        section TEXT NOT NULL,
        updated_at TIMESTAMPTZ DEFAULT now(),
        updated_by TEXT DEFAULT 'Unknown'
      );
      ALTER PUBLICATION supabase_realtime ADD TABLE brain_pages;
      ALTER TABLE brain_pages ENABLE ROW LEVEL SECURITY;
      CREATE POLICY "Allow all access" ON brain_pages FOR ALL USING (true) WITH CHECK (true);
      INSERT INTO brain_pages (title, content, section, updated_by) VALUES
        ('Marketing', '', 'Marketing', 'System'),
        ('Partnerships', '', 'Partnerships', 'System'),
        ('Tech', '', 'Tech', 'System'),
        ('Ideas', '', 'Ideas', 'System'),
        ('Growth', '', 'Growth', 'System'),
        ('General', '', 'General', 'System');
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green-500: #10B981; --green-600: #059669; --green-800: #065F46;
            --green-50: #ECFDF5; --green-100: #D1FAE5; --green-200: #A7F3D0;
            --bg: #F0FDF4; --surface: #FFFFFF; --text: #111827; --text-sec: #4B5563;
            --border: #D1FAE5; --radius: 14px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Auth */
        .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .auth-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; border: 1px solid var(--border); text-align: center; max-width: 420px; width: 100%; box-shadow: 0 2px 16px rgba(16,185,129,0.08); }
        .auth-card h2 { color: var(--green-800); margin-bottom: 6px; }
        .auth-card p { color: var(--text-sec); font-size: 0.9rem; margin-bottom: 24px; }
        .auth-input { width: 100%; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-family: inherit; margin-bottom: 16px; text-align: center; outline: none; }
        .auth-input:focus { border-color: var(--green-500); }
        .auth-error { color: #E11D48; font-size: 0.85rem; margin-bottom: 12px; display: none; }
        .btn { padding: 14px 28px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; font-family: inherit; background: var(--green-500); color: white; width: 100%; }
        .btn:hover { background: var(--green-600); }

        /* App layout */
        .app { display: none; height: 100vh; }
        .app-layout { display: flex; height: 100%; }

        /* Sidebar */
        .sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-size: 1.1rem; font-weight: 800; color: var(--green-800); }
        .sidebar-header small { font-size: 0.75rem; color: var(--text-sec); }
        .section-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .section-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; cursor: pointer; font-size: 0.9rem; color: var(--text-sec);
            transition: all 0.15s; border-left: 3px solid transparent;
        }
        .section-item:hover { background: var(--green-50); color: var(--text); }
        .section-item.active { background: var(--green-50); color: var(--green-800); border-left-color: var(--green-500); font-weight: 600; }
        .section-item .del { opacity: 0; background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .section-item:hover .del { opacity: 1; }
        .section-item .del:hover { color: #E11D48; background: #FEE2E2; }
        .add-btn { margin: 12px 20px; padding: 8px; border: 2px dashed var(--border); border-radius: 10px; background: transparent; color: var(--text-sec); font-size: 0.85rem; cursor: pointer; font-family: inherit; }
        .add-btn:hover { border-color: var(--green-500); color: var(--green-500); }

        /* Main editor */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
        .topbar h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
        .save-status { font-size: 0.8rem; color: var(--text-sec); }
        .save-status.saving { color: #F59E0B; }
        .save-status.saved { color: var(--green-500); }
        .editor-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); }
        #editor {
            flex: 1; width: 100%; padding: 28px; background: transparent; border: none;
            color: var(--text); font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.95rem; line-height: 1.8; resize: none; outline: none; overflow-y: auto;
        }
        #editor::placeholder { color: #ccc; }
        .footer { padding: 8px 28px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-sec); background: var(--surface); }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            #editor { padding: 20px 16px; font-size: 0.85rem; }
            .topbar { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2>Rewoven Brain</h2>
            <p>Enter the password to continue.</p>
            <input type="password" class="auth-input" id="passwordInput" placeholder="Password" onkeydown="if(event.key==='Enter')authenticate()">
            <div class="auth-error" id="authError">Incorrect password.</div>
            <button class="btn" onclick="authenticate()">Enter</button>
        </div>
    </div>

    <div class="app" id="app">
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Rewoven Brain</h2>
                    <small>Shared workspace</small>
                </div>
                <div class="section-list" id="sectionList"></div>
                <button class="add-btn" onclick="addSection()">+ Add Section</button>
            </aside>
            <div class="main">
                <div class="topbar">
                    <h1 id="sectionTitle">Select a section</h1>
                    <span class="save-status" id="saveStatus"></span>
                </div>
                <div class="editor-area">
                    <textarea id="editor" placeholder="Start writing..." disabled></textarea>
                </div>
                <div class="footer" id="footer">Select a section to begin</div>
            </div>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://puagdyacwgqkebjdbbrz.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_LarSIrAtxsvXN4RLLicQyw_TJk8s92b';
        var PASSWORD_HASH = '4314d9a52a45a17930f5d1127cfc9f640611376f7514530f6c5c782832dfec57';

        var userName = '';
        var currentSection = null;
        var saveTimer = null;
        var pollTimer = null;
        var lastSavedContent = '';

        function headers() {
            return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
        }

        // ---- Auth (same pattern as donations page) ----

        async function hashPassword(pw) {
            var data = new TextEncoder().encode(pw);
            var buf = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

        async function authenticate() {
            var pw = document.getElementById('passwordInput').value;
            var hashed = await hashPassword(pw);
            if (hashed === PASSWORD_HASH) {
                document.getElementById('authScreen').style.display = 'none';
                askName();
            } else {
                document.getElementById('authError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function askName() {
            var stored = sessionStorage.getItem('brain_name');
            if (stored) {
                userName = stored;
                startApp();
            } else {
                var name = prompt('Enter your name (so others know who edited):');
                if (!name || !name.trim()) name = 'Anonymous';
                userName = name.trim();
                sessionStorage.setItem('brain_name', userName);
                startApp();
            }
        }

        function startApp() {
            document.getElementById('app').style.display = 'block';
            loadSections();
        }

        // ---- Supabase REST calls ----

        async function loadSections() {
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages?select=title,section&order=title', { headers: headers() });
                if (!res.ok) { console.error('Load sections failed:', res.status); return; }
                var data = await res.json();
                renderSidebar(data);
            } catch (e) { console.error('Load sections error:', e); }
        }

        function renderSidebar(sections) {
            var list = document.getElementById('sectionList');
            list.innerHTML = '';
            for (var i = 0; i < sections.length; i++) {
                var s = sections[i];
                var div = document.createElement('div');
                div.className = 'section-item' + (currentSection === s.section ? ' active' : '');
                div.innerHTML = '<span>' + esc(s.title) + '</span><button class="del" onclick="event.stopPropagation();deleteSection(\'' + escAttr(s.section) + '\')">&times;</button>';
                div.setAttribute('data-section', s.section);
                div.onclick = (function(sec) { return function() { selectSection(sec); }; })(s.section);
                list.appendChild(div);
            }
        }

        async function selectSection(section) {
            // Save current before switching
            if (currentSection) saveNow();

            currentSection = section;
            document.getElementById('sectionTitle').textContent = section;
            document.getElementById('editor').disabled = false;
            document.getElementById('editor').value = '';
            document.getElementById('editor').placeholder = 'Loading...';

            // Highlight active
            var items = document.querySelectorAll('.section-item');
            for (var i = 0; i < items.length; i++) {
                items[i].className = 'section-item' + (items[i].getAttribute('data-section') === section ? ' active' : '');
            }

            // Load content
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages?section=eq.' + encodeURIComponent(section) + '&select=content,updated_by,updated_at', { headers: headers() });
                if (res.ok) {
                    var data = await res.json();
                    if (data.length > 0) {
                        document.getElementById('editor').value = data[0].content || '';
                        lastSavedContent = data[0].content || '';
                        var time = data[0].updated_at ? new Date(data[0].updated_at).toLocaleString() : '';
                        document.getElementById('footer').textContent = 'Last edited by ' + (data[0].updated_by || '?') + (time ? ' at ' + time : '');
                    }
                }
            } catch (e) { console.error(e); }

            document.getElementById('editor').placeholder = 'Start writing...';
            document.getElementById('editor').focus();

            // Start polling for changes from others
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(function() { pollChanges(); }, 3000);
        }

        async function pollChanges() {
            if (!currentSection) return;
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages?section=eq.' + encodeURIComponent(currentSection) + '&select=content,updated_by,updated_at', { headers: headers() });
                if (!res.ok) return;
                var data = await res.json();
                if (data.length > 0) {
                    var remote = data[0].content || '';
                    var editor = document.getElementById('editor');
                    // Only update if content changed AND it wasn't us who saved it
                    if (remote !== lastSavedContent && data[0].updated_by !== userName) {
                        var pos = editor.selectionStart;
                        editor.value = remote;
                        lastSavedContent = remote;
                        editor.selectionStart = editor.selectionEnd = Math.min(pos, remote.length);
                        var time = new Date(data[0].updated_at).toLocaleString();
                        document.getElementById('footer').textContent = 'Last edited by ' + data[0].updated_by + ' at ' + time;
                    }
                }
            } catch (e) {}
        }

        // ---- Save (debounced) ----

        document.addEventListener('input', function(e) {
            if (e.target.id === 'editor' && currentSection) {
                document.getElementById('saveStatus').textContent = 'Saving...';
                document.getElementById('saveStatus').className = 'save-status saving';
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(saveNow, 800);
            }
        });

        async function saveNow() {
            if (!currentSection) return;
            var content = document.getElementById('editor').value;
            lastSavedContent = content;
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages?section=eq.' + encodeURIComponent(currentSection), {
                    method: 'PATCH',
                    headers: headers(),
                    body: JSON.stringify({ content: content, updated_by: userName, updated_at: new Date().toISOString() })
                });
                if (res.ok) {
                    document.getElementById('saveStatus').textContent = 'Saved';
                    document.getElementById('saveStatus').className = 'save-status saved';
                    document.getElementById('footer').textContent = 'Last edited by ' + userName + ' at ' + new Date().toLocaleString();
                } else {
                    document.getElementById('saveStatus').textContent = 'Error saving';
                    document.getElementById('saveStatus').className = 'save-status';
                }
            } catch (e) {
                document.getElementById('saveStatus').textContent = 'Error saving';
            }
        }

        // ---- Add / Delete sections ----

        async function addSection() {
            var name = prompt('Section name:');
            if (!name || !name.trim()) return;
            name = name.trim();
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages', {
                    method: 'POST',
                    headers: headers(),
                    body: JSON.stringify({ title: name, section: name, content: '', updated_by: userName })
                });
                if (res.ok) {
                    loadSections();
                    selectSection(name);
                } else {
                    alert('Failed to add section. It may already exist.');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function deleteSection(section) {
            if (!confirm('Delete "' + section + '"? This cannot be undone.')) return;
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/brain_pages?section=eq.' + encodeURIComponent(section), {
                    method: 'DELETE',
                    headers: headers()
                });
                if (res.ok) {
                    if (currentSection === section) {
                        currentSection = null;
                        document.getElementById('editor').value = '';
                        document.getElementById('editor').disabled = true;
                        document.getElementById('sectionTitle').textContent = 'Select a section';
                        document.getElementById('footer').textContent = 'Select a section to begin';
                    }
                    loadSections();
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        // ---- Helpers ----

        function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        // ---- Boot ----
        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
