<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Carbon Trail | Rewoven Games</title>
<meta name="description" content="Trace a garment's journey and make choices to minimize its carbon footprint." />
<link rel="icon" href="../../assets/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a1208;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #E2E8F0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

/* Nav bar */
.rw-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(6,78,59,0.95), rgba(6,78,59,0.7) 80%, transparent);
    backdrop-filter: blur(8px);
}
.rw-bar a { color: #A7F3D0; text-decoration: none; font-weight: 700; font-size: 13px; }
.rw-bar a:hover { color: #34D399; }
.rw-bar .rw-title { color: #fff; font-weight: 800; font-size: 15px; }
.rw-back { padding: 4px 12px; border: 1px solid rgba(167,243,208,0.3); border-radius: 8px; }

/* Main layout */
.game-layout {
    position: relative;
    max-width: 750px;
    width: 100%;
    margin: 70px auto 40px;
    padding: 0 16px;
    flex: 1;
}

/* CO2 Meter sidebar */
.co2-sidebar {
    position: absolute;
    left: -100px;
    top: 0;
    width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}
.co2-meter {
    width: 32px;
    height: 280px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    border: 1px solid rgba(167,243,208,0.1);
    position: relative;
    overflow: hidden;
}
.co2-meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(0deg, #22C55E, #EAB308 50%, #EF4444);
    border-radius: 0 0 14px 14px;
    transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.co2-meter-label {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 700;
    color: #94A3B8;
    text-align: center;
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    letter-spacing: 1px;
    text-transform: uppercase;
}
.co2-value {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 800;
    color: #34D399;
    text-align: center;
    font-variant-numeric: tabular-nums;
    transition: color 0.5s;
}

/* Center content */
.game-center {
    width: 100%;
}

/* Garment sidebar */
.garment-sidebar {
    position: absolute;
    right: -140px;
    top: 0;
    width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}
.garment-preview {
    width: 100px;
    height: 130px;
    position: relative;
}
.garment-label {
    font-size: 10px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 8px;
    text-align: center;
}

/* Progress dots */
.progress-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
}
.progress-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #334155;
    background: transparent;
    transition: all 0.4s;
    position: relative;
}
.progress-dot.completed {
    background: #10B981;
    border-color: #10B981;
}
.progress-dot.current {
    border-color: #34D399;
    background: rgba(52,211,153,0.3);
    animation: dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
}

/* Stage header */
.stage-header {
    text-align: center;
    margin-bottom: 24px;
}
.stage-number {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #10B981;
    margin-bottom: 4px;
}
.stage-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
}
.stage-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #94A3B8;
    max-width: 500px;
    margin: 0 auto;
}

/* Scene SVG area */
.scene-container {
    width: 100%;
    height: 220px;
    margin-bottom: 24px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: #111D13;
    border: 1px solid rgba(167,243,208,0.08);
}
.scene-container svg {
    width: 100%;
    height: 100%;
}

/* Choice cards */
.choices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
}
.choice-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(167,243,208,0.12);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    position: relative;
    overflow: hidden;
}
.choice-card:hover {
    background: rgba(16,185,129,0.08);
    border-color: #34D399;
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(16,185,129,0.15);
}
.choice-card:active {
    transform: translateY(-2px);
}
.choice-card .card-icon {
    width: 100%;
    height: 80px;
    margin-bottom: 10px;
}
.choice-card .card-icon svg {
    width: 100%;
    height: 100%;
}
.choice-label {
    font-size: 14px;
    font-weight: 700;
    color: #E2E8F0;
    margin-bottom: 6px;
}
.choice-co2 {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    display: inline-block;
}
.eco-low { color: #22C55E; background: rgba(34,197,94,0.12); }
.eco-med { color: #EAB308; background: rgba(234,179,8,0.12); }
.eco-high { color: #EF4444; background: rgba(239,68,68,0.12); }

/* Result overlay after choice */
.result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,18,8,0.85);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
}
.result-overlay.visible {
    opacity: 1;
    pointer-events: auto;
}
.result-card {
    background: #111D13;
    border: 1px solid rgba(167,243,208,0.15);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.result-overlay.visible .result-card {
    transform: scale(1) translateY(0);
}
.result-co2-badge {
    font-size: 36px;
    font-weight: 900;
    margin-bottom: 8px;
}
.result-co2-badge.low { color: #22C55E; }
.result-co2-badge.med { color: #EAB308; }
.result-co2-badge.high { color: #EF4444; }
.result-choice-name {
    font-size: 16px;
    font-weight: 700;
    color: #A7F3D0;
    margin-bottom: 16px;
}
.result-fact {
    background: rgba(6,78,59,0.3);
    border: 1px solid rgba(167,243,208,0.12);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
}
.result-fact p {
    font-size: 14px;
    line-height: 1.7;
    color: #D1FAE5;
}
.btn {
    padding: 14px 40px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    background: linear-gradient(135deg, #10B981, #059669);
    color: #fff;
    box-shadow: 0 4px 14px rgba(16,185,129,0.4);
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(16,185,129,0.5);
}

/* Final results screen */
.final-screen {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
    padding-top: 20px;
}
.grade-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 900;
    margin: 0 auto 16px;
    animation: gradeAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes gradeAppear {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes gradePulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--grade-glow); }
    50% { box-shadow: 0 0 30px 8px var(--grade-glow); }
}
.grade-message {
    font-size: 18px;
    font-weight: 600;
    color: #E2E8F0;
    margin-bottom: 8px;
}
.final-co2 {
    font-size: 42px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
}
.final-co2-unit {
    font-size: 16px;
    font-weight: 600;
    color: #94A3B8;
}
.comparison-section {
    margin: 28px 0;
    text-align: left;
}
.comparison-row {
    margin-bottom: 16px;
}
.comparison-label {
    font-size: 12px;
    font-weight: 700;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}
.comparison-track {
    height: 24px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}
.comparison-bar {
    height: 100%;
    border-radius: 12px;
    transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0;
}
.avg-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #94A3B8;
}
.avg-marker::after {
    content: 'Industry Avg';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    color: #94A3B8;
    white-space: nowrap;
}
.choices-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 24px 0;
    text-align: left;
}
.summary-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(167,243,208,0.08);
    border-radius: 10px;
    padding: 10px 12px;
}
.summary-stage {
    font-size: 10px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.summary-choice {
    font-size: 13px;
    font-weight: 600;
    color: #E2E8F0;
}
.summary-co2 {
    font-size: 11px;
    font-weight: 700;
}

/* Animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
}
.fade-in { animation: fadeInUp 0.5s ease forwards; }
.slide-in { animation: slideIn 0.5s ease forwards; }

/* Scene-specific animations */
@keyframes smokePuff {
    0% { opacity: 0.7; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(2); }
}
@keyframes waterFlow {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
@keyframes vehicleMove {
    0% { transform: translateX(-20px); }
    100% { transform: translateX(420px); }
}
@keyframes spinCycle {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

/* Responsive */
@media (max-width: 768px) {
    .game-layout {
        flex-direction: column;
        margin-top: 60px;
        gap: 12px;
    }
    .co2-sidebar {
        flex-direction: row;
        width: 100%;
        padding-top: 0;
        gap: 12px;
        justify-content: center;
    }
    .co2-meter {
        width: 100%;
        max-width: 300px;
        height: 20px;
        border-radius: 10px;
    }
    .co2-meter-fill {
        bottom: 0;
        top: 0;
        right: auto;
        left: 0;
        width: 0;
        height: 100% !important;
        border-radius: 10px 0 0 10px;
        background: linear-gradient(90deg, #22C55E, #EAB308 50%, #EF4444);
        transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .co2-meter-label { display: none; }
    .co2-value {
        margin-top: 0;
        font-size: 13px;
        white-space: nowrap;
    }
    .garment-sidebar { display: none; }
    .stage-title { font-size: 22px; }
    .choices-grid {
        grid-template-columns: 1fr;
    }
    .scene-container { height: 160px; }
    .choices-summary { grid-template-columns: 1fr; }
}

/* Footer */
.rw-footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #475569;
}
.rw-footer a { color: #10B981; text-decoration: none; }
</style>
</head>
<body>

<div class="rw-bar">
    <a href="/game/" class="rw-back">&#8592; Games</a>
    <span class="rw-title">Fashion Carbon Trail</span>
    <span style="width:60px"></span>
</div>

<div id="carbon-trail-game"></div>

<div class="result-overlay" id="resultOverlay">
    <div class="result-card" id="resultCard"></div>
</div>

<div class="rw-footer">
    Made with care by <a href="/">Rewoven</a>
</div>

<script type="module">
import init, { new_game, get_stage_info, make_choice, get_grade, get_industry_avg, get_total_stages, get_all_choice_labels } from './pkg/carbon_trail.js';

let gameState = null;
let totalStages = 6;
let isMobile = window.innerWidth <= 768;
window.addEventListener('resize', () => { isMobile = window.innerWidth <= 768; });

// ==================== SVG Generators ====================

const SVG = {
    // Stage 1: Raw Material
    rawMaterial(choiceIdx) {
        const scenes = [
            // Organic cotton - green field with cotton plants
            `<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#134E4A"/><stop offset="100%" stop-color="#064E3B"/></linearGradient>
                    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#166534"/><stop offset="100%" stop-color="#14532D"/></linearGradient>
                </defs>
                <rect width="480" height="220" fill="url(#sky1)"/>
                <ellipse cx="80" cy="50" rx="30" ry="20" fill="#D9F99D" opacity="0.15"/>
                <ellipse cx="400" cy="40" rx="40" ry="18" fill="#D9F99D" opacity="0.1"/>
                <rect y="140" width="480" height="80" fill="url(#ground1)"/>
                <!-- Cotton plants -->
                ${[60,140,220,300,380].map((x,i) => `
                    <line x1="${x}" y1="170" x2="${x}" y2="130" stroke="#15803D" stroke-width="3"/>
                    <circle cx="${x}" cy="120" r="10" fill="#F0FDF4" opacity="0.9">
                        <animate attributeName="r" values="9;11;9" dur="${1.5+i*0.2}s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="${x-6}" cy="125" r="6" fill="#ECFDF5" opacity="0.7"/>
                    <circle cx="${x+7}" cy="118" r="7" fill="#ECFDF5" opacity="0.8"/>
                `).join('')}
                <text x="240" y="200" text-anchor="middle" fill="#A7F3D0" font-size="12" font-weight="600" opacity="0.6">Organic Cotton Field</text>
            </svg>`,
            // Conventional cotton - brown field
            `<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#292524"/><stop offset="100%" stop-color="#1C1917"/></linearGradient>
                </defs>
                <rect width="480" height="220" fill="url(#sky2)"/>
                <rect y="140" width="480" height="80" fill="#78716C"/>
                <!-- Rows of cotton -->
                ${[60,140,220,300,380].map((x,i) => `
                    <line x1="${x}" y1="170" x2="${x}" y2="135" stroke="#A8A29E" stroke-width="2"/>
                    <circle cx="${x}" cy="128" r="8" fill="#D6D3D1" opacity="0.7"/>
                    <circle cx="${x-5}" cy="132" r="5" fill="#D6D3D1" opacity="0.5"/>
                `).join('')}
                <!-- Pesticide sprayer -->
                <rect x="180" y="80" width="120" height="40" rx="8" fill="#57534E" opacity="0.5"/>
                <text x="240" y="105" text-anchor="middle" fill="#A8A29E" font-size="11" font-weight="600">PESTICIDES</text>
                <line x1="200" y1="120" x2="200" y2="140" stroke="#EAB308" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
                <line x1="240" y1="120" x2="240" y2="140" stroke="#EAB308" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
                <line x1="280" y1="120" x2="280" y2="140" stroke="#EAB308" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
                <text x="240" y="200" text-anchor="middle" fill="#A8A29E" font-size="12" font-weight="600" opacity="0.6">Conventional Cotton</text>
            </svg>`,
            // Polyester - oil derrick
            `<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
                <rect width="480" height="220" fill="#1C1917"/>
                <rect y="160" width="480" height="60" fill="#292524"/>
                <!-- Oil derrick -->
                <polygon points="240,30 210,160 270,160" fill="none" stroke="#78716C" stroke-width="3"/>
                <line x1="240" y1="30" x2="240" y2="160" stroke="#78716C" stroke-width="2"/>
                <line x1="220" y1="70" x2="260" y2="70" stroke="#78716C" stroke-width="2"/>
                <line x1="215" y1="100" x2="265" y2="100" stroke="#78716C" stroke-width="2"/>
                <line x1="210" y1="130" x2="270" y2="130" stroke="#78716C" stroke-width="2"/>
                <!-- Pump -->
                <rect x="280" y="120" width="60" height="40" rx="4" fill="#57534E"/>
                <line x1="310" y1="120" x2="310" y2="100" stroke="#78716C" stroke-width="3"/>
                <line x1="310" y1="100" x2="350" y2="110" stroke="#78716C" stroke-width="3"/>
                <!-- Oil drops -->
                ${[160,180,320,340].map((x,i) => `
                    <circle cx="${x}" cy="${170+i*5}" r="3" fill="#1a1a1a" opacity="0.6"/>
                `).join('')}
                <!-- Flames -->
                <ellipse cx="120" cy="130" rx="8" ry="16" fill="#EF4444" opacity="0.6">
                    <animate attributeName="ry" values="14;18;14" dur="0.5s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="120" cy="125" rx="5" ry="10" fill="#F97316" opacity="0.8">
                    <animate attributeName="ry" values="8;12;8" dur="0.4s" repeatCount="indefinite"/>
                </ellipse>
                <text x="240" y="200" text-anchor="middle" fill="#78716C" font-size="12" font-weight="600" opacity="0.6">Petroleum Extraction</text>
            </svg>`
        ];
        return choiceIdx !== undefined ? scenes[choiceIdx] : scenes;
    },

    // Stage 2: Manufacturing
    manufacturing(choiceIdx) {
        const smokeLevels = [1, 3, 6]; // smoke puff count
        const colors = ['#10B981', '#78716C', '#44403C'];
        const roofColors = ['#059669', '#57534E', '#44403C'];
        const scenes = [0,1,2].map(i => {
            const numSmoke = smokeLevels[i];
            let smokePuffs = '';
            for(let s = 0; s < numSmoke; s++) {
                const sx = 300 + s*20 - numSmoke*10;
                smokePuffs += `<circle cx="${sx}" cy="${70-s*8}" r="${6+s*2}" fill="#94A3B8" opacity="${0.15+s*0.05}">
                    <animate attributeName="cy" values="${70-s*8};${30-s*8}" dur="${2+s*0.5}s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="${0.15+s*0.05};0" dur="${2+s*0.5}s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="${6+s*2};${12+s*3}" dur="${2+s*0.5}s" repeatCount="indefinite"/>
                </circle>`;
            }
            const solar = i === 0 ? `
                <rect x="210" y="100" width="25" height="15" rx="2" fill="#1E40AF" opacity="0.7"/>
                <rect x="240" y="100" width="25" height="15" rx="2" fill="#1E40AF" opacity="0.7"/>
                <line x1="222" y1="100" x2="222" y2="115" stroke="#60A5FA" stroke-width="0.5"/>
                <line x1="235" y1="100" x2="235" y2="115" stroke="#60A5FA" stroke-width="0.5"/>
                <line x1="252" y1="100" x2="252" y2="115" stroke="#60A5FA" stroke-width="0.5"/>
                <line x1="265" y1="100" x2="265" y2="115" stroke="#60A5FA" stroke-width="0.5"/>
                <!-- Sun rays -->
                <circle cx="100" cy="50" r="18" fill="#FBBF24" opacity="0.3"/>
                <circle cx="100" cy="50" r="12" fill="#FBBF24" opacity="0.5"/>
            ` : '';

// Map choice index to card icon key
const CARD_ICON_KEYS = [
    ['organicCotton', 'conventionalCotton', 'polyester'],
    ['renewableFactory', 'standardFactory', 'sweatshop'],
    ['naturalDyes', 'lowImpactDyes', 'chemicalDyes'],
    ['train', 'ship', 'airplane'],
    ['coldWash', 'warmWash', 'hotWash'],
    ['repair', 'thrift', 'recycle', 'landfill'],
];

// Scene SVG getters by stage
const SCENE_GETTERS = [
    SVG.rawMaterial,
    SVG.manufacturing,
    SVG.dyeing,
    SVG.shipping,
    SVG.consumerUse,
    SVG.endOfLife,
];

// ==================== Rendering ====================

function renderGame() {
    const container = document.getElementById('carbon-trail-game');
    const state = JSON.parse(gameState);
    const stage = state.current_stage;
    const maxCO2 = 40;
    const meterPct = Math.min(state.total_co2 / maxCO2 * 100, 100);

    // Color for CO2 value
    let co2Color = '#34D399';
    if (state.total_co2 > 25) co2Color = '#EF4444';
    else if (state.total_co2 > 15) co2Color = '#EAB308';

    if (stage >= totalStages) {
        renderFinalScreen(container, state);
        return;
    }

    const stageInfo = JSON.parse(get_stage_info(stage));

    // Build progress dots
    let dots = '';
    for (let i = 0; i < totalStages; i++) {
        const cls = i < stage ? 'completed' : i === stage ? 'current' : '';
        dots += `<div class="progress-dot ${cls}"></div>`;
    }

    // Build choice cards
    let cards = '';
    const iconKeys = CARD_ICON_KEYS[stage];
    stageInfo.choices.forEach((choice, idx) => {
        const ecoClass = choice.eco_level === 'low' ? 'eco-low' : choice.eco_level === 'med' ? 'eco-med' : 'eco-high';
        const ecoLabel = choice.eco_level === 'low' ? 'Low Impact' : choice.eco_level === 'med' ? 'Medium' : 'High Impact';
        const iconSvg = SVG.cardIcons[iconKeys[idx]] || '';
        cards += `
            <div class="choice-card" data-choice="${idx}" style="animation-delay:${idx*0.1}s">
                <div class="card-icon">${iconSvg}</div>
                <div class="choice-label">${choice.label}</div>
                <span class="choice-co2 ${ecoClass}">~${choice.co2.toFixed(1)} kg &middot; ${ecoLabel}</span>
            </div>
        `;
    });

    // Scene SVG - show the "neutral" scene or a composite
    const sceneGetter = SCENE_GETTERS[stage];
    // Show all scenes side-by-side as a hint of what each choice looks like? No, show a neutral scene.
    // For the "scene" area, show a general scene for the stage
    const sceneSvg = sceneGetter(0); // default to first option's scene as a preview

    // Build garment preview
    const garmentSvg = SVG.garment(stage, state.choices_made);

    container.innerHTML = `
        <div class="game-layout">
            <div class="co2-sidebar">
                <div class="co2-meter">
                    <div class="co2-meter-fill" style="height:${meterPct}%;" id="co2Fill"></div>
                </div>
                <div class="co2-meter-label">CO2</div>
                <div class="co2-value" style="color:${co2Color}">${state.total_co2.toFixed(1)} kg</div>
            </div>
            <div class="game-center">
                <div class="progress-dots">${dots}</div>
                <div class="stage-header fade-in">
                    <div class="stage-number">Stage ${stage + 1} of ${totalStages}</div>
                    <div class="stage-title">${stageInfo.title}</div>
                    <div class="stage-desc">${stageInfo.description}</div>
                </div>
                <div class="scene-container fade-in" id="sceneArea">${sceneSvg}</div>
                <div class="choices-grid">${cards}</div>
            </div>
            ${!isMobile ? `
            <div class="garment-sidebar">
                <div class="garment-preview">${garmentSvg}</div>
                <div class="garment-label">Your Garment</div>
            </div>
            ` : ''}
        </div>
    `;

    // Mobile CO2 meter - horizontal fill
    if (isMobile) {
        const fill = document.getElementById('co2Fill');
        if (fill) {
            fill.style.height = 'auto';
            fill.style.width = meterPct + '%';
        }
    }

    // Attach choice click listeners
    document.querySelectorAll('.choice-card').forEach(card => {
        card.addEventListener('click', () => {
            const choiceIdx = parseInt(card.dataset.choice);
            handleChoice(stage, choiceIdx);
        });
    });
}

function handleChoice(stageIdx, choiceIdx) {
    // Update scene to show the chosen option's SVG
    const sceneArea = document.getElementById('sceneArea');
    if (sceneArea) {
        const sceneGetter = SCENE_GETTERS[stageIdx];
        sceneArea.innerHTML = sceneGetter(choiceIdx);
    }

    // Call Rust to process the choice
    const resultJson = make_choice(gameState, stageIdx, choiceIdx);
    const result = JSON.parse(resultJson);

    // Update game state
    gameState = JSON.stringify(result.state);

    // Show result overlay after a brief delay for the scene animation
    setTimeout(() => {
        showResultOverlay(result);
    }, 600);
}

function showResultOverlay(result) {
    const overlay = document.getElementById('resultOverlay');
    const card = document.getElementById('resultCard');

    const ecoClass = result.co2_added <= 1.5 ? 'low' : result.co2_added <= 4.0 ? 'med' : 'high';

    card.innerHTML = `
        <div class="result-co2-badge ${ecoClass}">+${result.co2_added.toFixed(1)} kg CO2</div>
        <div class="result-choice-name">${result.choice_label}</div>
        <div class="result-fact"><p>${result.fact}</p></div>
        <button class="btn" id="continueBtn">${result.game_over ? 'See Results' : 'Continue'}</button>
    `;

    overlay.classList.add('visible');

    document.getElementById('continueBtn').addEventListener('click', () => {
        overlay.classList.remove('visible');
        setTimeout(() => {
            renderGame();
        }, 300);
    });
}

function renderFinalScreen(container, state) {
    const gradeInfo = JSON.parse(get_grade(state.total_co2));
    const industryAvg = get_industry_avg();
    const maxCO2 = 40;
    const yourPct = Math.min(state.total_co2 / maxCO2 * 100, 100);
    const avgPct = Math.min(industryAvg / maxCO2 * 100, 100);

    const allLabels = JSON.parse(get_all_choice_labels());
    const stageNames = ['Raw Material', 'Manufacturing', 'Dyeing', 'Shipping', 'Consumer Use', 'End of Life'];

    let summaryItems = '';
    state.choices_made.forEach((choiceIdx, stageIdx) => {
        const co2 = state.co2_per_stage[stageIdx];
        const ecoClass = co2 <= 1.5 ? 'eco-low' : co2 <= 4.0 ? 'eco-med' : 'eco-high';
        summaryItems += `
            <div class="summary-item">
                <div class="summary-stage">${stageNames[stageIdx]}</div>
                <div class="summary-choice">${allLabels[stageIdx][choiceIdx]}</div>
                <div class="summary-co2 ${ecoClass}">${co2.toFixed(1)} kg CO2</div>
            </div>
        `;
    });

    const comparison = state.total_co2 < industryAvg
        ? `${(industryAvg - state.total_co2).toFixed(1)} kg less than`
        : `${(state.total_co2 - industryAvg).toFixed(1)} kg more than`;

    // Garment preview with all choices
    const garmentSvg = SVG.garment(6, state.choices_made);

    container.innerHTML = `
        <div class="game-layout" style="justify-content:center;">
            <div class="final-screen">
                <div class="grade-circle" style="border-color:${gradeInfo.color}; color:${gradeInfo.color}; --grade-glow:${gradeInfo.color}40; animation: gradeAppear 0.6s cubic-bezier(0.34,1.56,0.64,1), gradePulse 2s ease-in-out 0.6s infinite;">${gradeInfo.grade}</div>
                <div class="grade-message">${gradeInfo.message}</div>
                <div class="final-co2" style="color:${gradeInfo.color}">
                    <span id="co2Counter">0.0</span>
                    <span class="final-co2-unit">kg CO2</span>
                </div>

                <div class="comparison-section">
                    <div class="comparison-row">
                        <div class="comparison-label">
                            <span>Your Garment</span>
                            <span style="color:${gradeInfo.color}">${state.total_co2.toFixed(1)} kg</span>
                        </div>
                        <div class="comparison-track">
                            <div class="comparison-bar" id="yourBar" style="background:${gradeInfo.color};"></div>
                            <div class="avg-marker" style="left:${avgPct}%;"></div>
                        </div>
                    </div>
                    <p style="font-size:13px; color:#94A3B8; text-align:center; margin-top:4px;">
                        That's <strong style="color:#E2E8F0">${comparison}</strong> the industry average of ${industryAvg.toFixed(1)} kg CO2.
                    </p>
                </div>

                <div class="choices-summary">${summaryItems}</div>

                <button class="btn" id="playAgainBtn" style="margin-top:16px;">Play Again</button>
            </div>
        </div>
    `;

    // Animate the CO2 counter
    const counterEl = document.getElementById('co2Counter');
    const targetCO2 = state.total_co2;
    let current = 0;
    const duration = 1500;
    const start = performance.now();
    function animateCounter(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        current = targetCO2 * eased;
        counterEl.textContent = current.toFixed(1);
        if (progress < 1) requestAnimationFrame(animateCounter);
    }
    requestAnimationFrame(animateCounter);

    // Animate the comparison bar
    setTimeout(() => {
        const bar = document.getElementById('yourBar');
        if (bar) bar.style.width = yourPct + '%';
    }, 300);

    // Play again
    document.getElementById('playAgainBtn').addEventListener('click', () => {
        gameState = new_game();
        renderGame();
    });
}

// ==================== Init ====================
async function run() {
    await init();
    totalStages = get_total_stages();
    gameState = new_game();
    renderGame();
}

run().catch(console.error);
</script>
