<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Factory Sort | Rewoven Games</title>
<link rel="icon" href="../../assets/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0e1a; font-family: 'Inter', sans-serif; }
canvas#glcanvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }

/* Nav bar */
.rw-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(6,78,59,0.95), rgba(6,78,59,0.7) 80%, transparent);
    pointer-events: none;
}
.rw-bar > * { pointer-events: auto; }
.rw-bar a { color: #A7F3D0; text-decoration: none; font-weight: 700; font-size: 13px; }
.rw-bar a:hover { color: #34D399; }
.rw-bar .rw-title { color: #fff; font-weight: 800; font-size: 15px; }
.rw-back { padding: 4px 12px; border: 1px solid rgba(167,243,208,0.3); border-radius: 8px; }

/* Loading screen */
#loading {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0a0e1a; color: #94A3B8; font-size: 18px;
}
#loading .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(16,185,129,0.2);
    border-top-color: #10B981; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading.hidden { display: none; }
</style>
</head>
<body>

<div class="rw-bar">
    <a href="/game/" class="rw-back">Back to Games</a>
    <span class="rw-title">Factory Sort</span>
    <span></span>
</div>

<div id="loading">
    <div class="spinner"></div>
    <div>Loading Factory Sort...</div>
    <div style="color:#475569;font-size:13px;margin-top:8px;">Powered by Rust + WebAssembly</div>
</div>

<canvas id="glcanvas" tabindex="1"></canvas>

<script src="mq_gl.js"></script>
<script>
// Hide loading when WASM starts
var _origMain = null;
var _checkInterval = setInterval(function() {
    if (document.getElementById("glcanvas").width > 0) {
        document.getElementById("loading").classList.add("hidden");
        clearInterval(_checkInterval);
    }
}, 100);
// Also hide after a timeout regardless
setTimeout(function() {
    document.getElementById("loading").classList.add("hidden");
    clearInterval(_checkInterval);
}, 5000);

load("factory-sort.wasm");
</script>
</body>
</html>
