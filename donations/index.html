<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Registrations | Rewoven Admin</title>
    <link rel="icon" href="../assets/logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green-500: #10B981; --green-600: #059669; --green-800: #065F46;
            --green-50: #ECFDF5; --green-100: #D1FAE5; --green-200: #A7F3D0;
            --bg: #F0FDF4; --surface: #FFFFFF; --text: #111827; --text-sec: #4B5563;
            --border: #D1FAE5; --radius: 14px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .auth-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; border: 1px solid var(--border); text-align: center; max-width: 420px; width: 100%; box-shadow: 0 2px 16px rgba(16,185,129,0.08); }
        .auth-card h2 { color: var(--green-800); margin-bottom: 6px; }
        .auth-card p { color: var(--text-sec); font-size: 0.9rem; margin-bottom: 24px; }
        .auth-input { width: 100%; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-family: inherit; margin-bottom: 16px; text-align: center; outline: none; }
        .auth-input:focus { border-color: var(--green-500); }
        .auth-error { color: #E11D48; font-size: 0.85rem; margin-bottom: 12px; display: none; }
        .btn { padding: 14px 28px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; font-family: inherit; background: var(--green-500); color: white; width: 100%; }
        .btn:hover { background: var(--green-600); }

        .dashboard { display: none; }
        .header { background: rgba(255,255,255,0.95); border-bottom: 1px solid var(--border); padding: 16px 24px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--green-800); text-decoration: none; }
        .logo small { font-weight: 400; font-size: 0.75rem; color: var(--text-sec); margin-left: 6px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-sm { padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-green { background: var(--green-500); color: white; }
        .btn-green:hover { background: var(--green-600); }
        .btn-outline { background: transparent; color: var(--green-800); border: 2px solid var(--border); }
        .btn-outline:hover { border-color: var(--green-500); }
        .count-badge { font-size: 0.8rem; color: var(--text-sec); }

        .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        .table-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: 0 2px 16px rgba(16,185,129,0.08); }
        .table-header { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .table-header h3 { font-size: 1rem; font-weight: 700; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: var(--green-50); padding: 12px 16px; text-align: left; font-weight: 700; color: var(--text-sec); white-space: nowrap; border-bottom: 2px solid var(--border); position: sticky; top: 0; }
        td { padding: 12px 16px; border-bottom: 1px solid #eee; white-space: nowrap; }
        tr:hover td { background: var(--green-50); }

        .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-dropoff { background: #DBEAFE; color: #1E40AF; }
        .badge-pickup { background: #FEF3C7; color: #92400E; }
        .badge-ship { background: #EDE9FE; color: #5B21B6; }

        .empty-state { text-align: center; padding: 60px 24px; color: var(--text-sec); }
        .empty-state h3 { color: var(--text); margin-bottom: 8px; }

        @media (max-width: 640px) { .header-inner { flex-direction: column; gap: 12px; } }
    </style>
</head>
<body>
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2>Donation Admin</h2>
            <p>Enter the password to view registrations.</p>
            <input type="password" class="auth-input" id="passwordInput" placeholder="Password" onkeydown="if(event.key==='Enter')authenticate()">
            <div class="auth-error" id="authError">Incorrect password.</div>
            <button class="btn" onclick="authenticate()">View Registrations</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <header class="header">
            <div class="header-inner">
                <a href="/bakdonate/" class="logo">Rewoven<small>Donation Registrations</small></a>
                <div class="header-actions">
                    <span class="count-badge" id="countBadge"></span>
                    <button class="btn-sm btn-outline" onclick="exportCSV()">Export CSV</button>
                    <button class="btn-sm btn-outline" onclick="loadData()">Refresh</button>
                    <button class="btn-sm" style="background:#E11D48;color:white;" onclick="clearAll()">Clear All</button>
                    <a href="/bakdonate/" class="btn-sm btn-green">Donation Page</a>
                </div>
            </div>
        </header>
        <div class="container">
            <div class="table-card">
                <div class="table-header">
                    <h3>All Registrations</h3>
                </div>
                <div class="table-scroll" id="tableContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://puagdyacwgqkebjdbbrz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LarSIrAtxsvXN4RLLicQyw_TJk8s92b';
        const PASSWORD_HASH = '4314d9a52a45a17930f5d1127cfc9f640611376f7514530f6c5c782832dfec57';

        let allRegistrations = [];

        async function hashPassword(pw) {
            const data = new TextEncoder().encode(pw);
            const buf = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function authenticate() {
            const pw = document.getElementById('passwordInput').value;
            const hashed = await hashPassword(pw);
            if (hashed === PASSWORD_HASH) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadData();
            } else {
                document.getElementById('authError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        async function loadData() {
            let supabaseData = [];
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/donation_registrations?select=*&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (res.ok) supabaseData = await res.json();
            } catch (e) { console.warn('Supabase fetch failed:', e); }

            allRegistrations = supabaseData;
            document.getElementById('countBadge').textContent = `${allRegistrations.length} registrations`;
            renderTable();
        }

        function methodBadge(method) {
            const map = { dropoff: ['Drop-off', 'badge-dropoff'], pickup: ['Pickup', 'badge-pickup'], ship: ['Shipping', 'badge-ship'] };
            const [label, cls] = map[method] || [method || '-', ''];
            return `<span class="badge ${cls}">${label}</span>`;
        }

        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function renderTable() {
            if (allRegistrations.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<div class="empty-state"><h3>No registrations yet</h3><p>Share the donation page to start collecting.</p></div>';
                return;
            }

            let html = '<table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Items</th><th>Method</th><th>Notes</th></tr></thead><tbody>';
            for (const r of allRegistrations) {
                const date = r.created_at ? new Date(r.created_at).toLocaleString('en-AE', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
                html += `<tr>
                    <td>${date}</td>
                    <td style="font-weight:600;">${esc(r.name)}</td>
                    <td><a href="mailto:${esc(r.email)}" style="color:var(--green-600);text-decoration:none;">${esc(r.email)}</a></td>
                    <td>${esc(r.phone) || '-'}</td>
                    <td>${esc(r.city)}</td>
                    <td>${esc(r.estimated_items) || '-'}</td>
                    <td>${methodBadge(r.method)}</td>
                    <td>${esc(r.notes) || '-'}</td>
                </tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function exportCSV() {
            if (allRegistrations.length === 0) return;
            const fields = ['created_at', 'name', 'email', 'phone', 'city', 'estimated_items', 'method', 'notes'];
            const headers = ['Date', 'Name', 'Email', 'Phone', 'City', 'Items', 'Method', 'Notes'];
            let csv = headers.join(',') + '\n';
            for (const r of allRegistrations) {
                csv += fields.map(f => `"${String(r[f] || '').replace(/"/g, '""')}"`).join(',') + '\n';
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = `rewoven-donations-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        }

        async function clearAll() {
            if (allRegistrations.length === 0) return;
            if (!confirm('Are you sure you want to delete all ' + allRegistrations.length + ' registrations? This cannot be undone.')) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/donation_registrations?id=gt.0`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (res.ok) {
                    allRegistrations = [];
                    renderTable();
                    document.getElementById('countBadge').textContent = '0 registrations';
                } else {
                    alert('Failed to delete registrations.');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
