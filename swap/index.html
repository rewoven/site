<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sustainable Swap Finder | Rewoven</title>
  <meta name="description" content="Find sustainable alternatives to your favorite fashion brands. Enter what you bought and we'll find a greener option." />
  <meta property="og:title" content="Sustainable Swap Finder | Rewoven" />
  <meta property="og:description" content="Find sustainable alternatives to your favorite fashion brands." />
  <meta property="og:image" content="../assets/rewoven-logo.jpeg" />
  <link rel="icon" href="../assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    :root {
      --green-50: #ECFDF5; --green-100: #D1FAE5; --green-200: #A7F3D0;
      --green-400: #34D399; --green-500: #10B981; --green-600: #059669;
      --green-700: #047857; --green-800: #065F46; --green-900: #064E3B;
      --red-50: #FEF2F2; --red-100: #FEE2E2; --red-400: #F87171; --red-500: #EF4444; --red-600: #DC2626;
      --gold: #F59E0B; --gold-dark: #D97706;
      --dark: #111827; --gray-600: #4B5563; --gray-400: #9CA3AF;
      --gray-200: #E5E7EB; --white: #FFFFFF; --bg-cream: #F0FDF4;
      --radius: 16px;
    }

    [data-theme="dark"] {
      --white: #0F172A; --bg-cream: #0F172A; --dark: #F1F5F9;
      --gray-600: #94A3B8; --gray-400: #64748B; --gray-200: #334155;
      --green-50: #0F2A1F; --green-100: #14332A;
      --red-50: #1C1017; --red-100: #2D1B1B;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--dark); background: var(--white);
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 72px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(229,231,235,0.5);
      transition: background 0.3s;
    }
    [data-theme="dark"] nav { background: rgba(15,23,42,0.85); }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 100%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--dark); }
    .nav-logo img { width: 36px; height: 36px; border-radius: 10px; }
    .nav-logo span { font-weight: 800; font-size: 20px; font-family: 'Playfair Display', serif; color: var(--green-800); }
    [data-theme="dark"] .nav-logo span { color: var(--green-400); }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--gray-600); font-weight: 500; font-size: 15px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--green-600); }
    .nav-links a.active { color: var(--green-600); font-weight: 600; }
    .theme-toggle {
      background: var(--green-50); border: 1px solid var(--green-200);
      border-radius: 50%; width: 38px; height: 38px; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .nav-hamburger { display: none; background: none; border: none; cursor: pointer; padding: 8px; }
    .nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--dark); margin: 5px 0; border-radius: 2px; transition: 0.3s; }

    @media (max-width: 768px) {
      .nav-links { display: none; position: fixed; top: 72px; left: 0; right: 0; background: var(--white); flex-direction: column; padding: 24px; gap: 20px; border-bottom: 1px solid var(--gray-200); }
      .nav-links.open { display: flex; }
      .nav-hamburger { display: block; }
    }

    /* Hero */
    .hero {
      padding: 140px 24px 60px; text-align: center;
      background: linear-gradient(135deg, var(--green-50), var(--white));
    }
    .hero-label {
      display: inline-block; padding: 6px 16px; border-radius: 50px;
      background: var(--green-100); color: var(--green-800);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800; line-height: 1.15; margin-bottom: 16px;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--green-500), var(--green-700));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--gray-600); font-size: 1.1rem; max-width: 500px; margin: 0 auto 40px; }

    /* Search */
    .search-box {
      max-width: 600px; margin: 0 auto; position: relative;
    }
    .search-input {
      width: 100%; padding: 20px 140px 20px 24px;
      border: 2px solid var(--green-200); border-radius: 16px;
      font-size: 1.1rem; font-family: inherit; background: var(--white);
      color: var(--dark); outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--green-500); }
    .search-input::placeholder { color: var(--gray-400); }
    .search-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      padding: 12px 28px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--green-500), var(--green-700));
      color: white; font-weight: 700; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: all 0.2s;
    }
    .search-btn:hover { transform: translateY(-50%) scale(1.03); }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: translateY(-50%); }

    /* Result */
    .result-section {
      max-width: 700px; margin: 0 auto; padding: 40px 24px 80px;
    }

    .swap-card {
      border-radius: 20px; overflow: hidden;
      border: 2px solid var(--green-200);
      background: var(--white);
      box-shadow: 0 4px 24px rgba(16,185,129,0.1);
    }

    .swap-header {
      padding: 20px 28px; text-align: center;
      background: var(--green-50); border-bottom: 1px solid var(--green-200);
      font-size: 0.85rem; color: var(--gray-600);
    }
    .swap-header strong { color: var(--dark); }

    .swap-body { display: grid; grid-template-columns: 1fr auto 1fr; }

    .swap-brand {
      padding: 32px 28px; text-align: center;
    }
    .swap-brand.original { background: var(--red-50); }
    .swap-brand.alternative { background: var(--green-50); }

    .swap-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 12px;
    }
    .swap-brand.original .swap-label { color: var(--red-500); }
    .swap-brand.alternative .swap-label { color: var(--green-600); }

    .swap-name {
      font-family: 'Playfair Display', serif; font-size: 1.5rem;
      font-weight: 800; margin-bottom: 8px; color: var(--dark);
    }

    .swap-grade {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px;
      font-weight: 800; font-size: 1.1rem; margin-bottom: 12px;
    }
    .grade-red { background: var(--red-100); color: var(--red-600); }
    .grade-orange { background: #FEF3C7; color: #D97706; }
    .grade-yellow { background: #FEF9C3; color: #A16207; }
    .grade-green { background: var(--green-100); color: var(--green-700); }

    .swap-score {
      font-size: 2.5rem; font-weight: 900; line-height: 1;
    }
    .swap-score small { font-size: 1rem; font-weight: 500; color: var(--gray-400); }
    .swap-brand.original .swap-score { color: var(--red-500); }
    .swap-brand.alternative .swap-score { color: var(--green-600); }

    .swap-meta {
      margin-top: 12px; font-size: 0.8rem; color: var(--gray-600); line-height: 1.6;
    }

    .swap-scores {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-top: 16px; text-align: left;
    }
    .swap-scores .ss-item {
      font-size: 0.75rem; color: var(--gray-600);
      display: flex; justify-content: space-between;
      padding: 4px 8px; background: rgba(0,0,0,0.03); border-radius: 6px;
    }
    .swap-scores .ss-item span:last-child { font-weight: 700; color: var(--dark); }

    .swap-arrow {
      display: flex; align-items: center; justify-content: center;
      padding: 0 8px; font-size: 2rem; color: var(--green-500);
      background: var(--white);
    }

    .swap-improvement {
      padding: 20px 28px; text-align: center;
      background: linear-gradient(135deg, var(--green-500), var(--green-700));
      color: white;
    }
    .swap-improvement .big { font-size: 1.8rem; font-weight: 900; }
    .swap-improvement .sub { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    .swap-footer {
      padding: 16px 28px; text-align: center;
      border-top: 1px solid var(--green-200);
      font-size: 0.75rem; color: var(--gray-400);
      display: flex; justify-content: space-between; align-items: center;
    }
    .swap-footer img { width: 20px; height: 20px; border-radius: 5px; }

    /* More swaps */
    .more-swaps {
      margin-top: 24px;
    }
    .more-swaps h3 {
      font-size: 0.85rem; font-weight: 700; color: var(--gray-600);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }
    .more-swap-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: var(--green-50); border-radius: 12px;
      margin-bottom: 8px; transition: all 0.2s;
    }
    .more-swap-item:hover { transform: translateX(4px); }
    .more-swap-name { font-weight: 700; font-size: 0.95rem; }
    .more-swap-info { font-size: 0.8rem; color: var(--gray-600); }
    .more-swap-score { font-weight: 800; font-size: 1.1rem; color: var(--green-600); }

    /* Good pick message */
    .good-pick {
      text-align: center; padding: 48px 28px;
      background: var(--green-50); border-radius: 20px;
      border: 2px solid var(--green-200);
    }
    .good-pick .emoji { font-size: 3rem; margin-bottom: 16px; }
    .good-pick h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--green-800); margin-bottom: 8px; }
    .good-pick p { color: var(--gray-600); font-size: 1rem; }
    .good-pick .score { font-size: 3rem; font-weight: 900; color: var(--green-600); margin: 16px 0; }

    /* Error */
    .error-card {
      text-align: center; padding: 48px 28px;
      background: var(--red-50); border-radius: 20px;
      border: 2px solid var(--red-100);
    }
    .error-card .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .error-card p { color: var(--gray-600); font-size: 0.95rem; max-width: 400px; margin: 0 auto; }

    /* Loading */
    .loading {
      text-align: center; padding: 60px 24px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid var(--green-200);
      border-top-color: var(--green-500); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--gray-400); font-size: 0.9rem; }

    /* Share button */
    .share-row {
      display: flex; gap: 10px; justify-content: center; margin-top: 24px;
    }
    .share-btn {
      padding: 10px 20px; border-radius: 10px; border: 2px solid var(--green-200);
      background: var(--green-50); color: var(--green-800);
      font-weight: 600; font-size: 0.85rem; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .share-btn:hover { background: var(--green-100); }

    @media (max-width: 640px) {
      .swap-body { grid-template-columns: 1fr; }
      .swap-arrow { transform: rotate(90deg); padding: 12px 0; }
      .swap-brand { padding: 24px 20px; }
      .swap-name { font-size: 1.2rem; }
      .swap-score { font-size: 2rem; }
      .swap-scores { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="../assets/logo.png" alt="Rewoven" />
        <span>Rewoven</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/brands/">Brands</a></li>
        <li><a href="/swap/" class="active">Swap</a></li>
        <li><a href="/donate/">Donate</a></li>
        <li><a href="/game/">Games</a></li>
        <li><button class="theme-toggle" id="themeToggle">&#127769;</button></li>
      </ul>
      <button class="nav-hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-label">Sustainable Swap Finder</div>
    <h1>What did you<br>just <em>buy</em>?</h1>
    <p>Enter any product or brand and we'll find you a more sustainable alternative.</p>
    <div class="search-box">
      <input type="text" class="search-input" id="swapInput" placeholder="e.g. Nike Air Force 1, Zara dress, H&M jacket..." autocomplete="off" />
      <button class="search-btn" id="swapBtn" onclick="doSwap()">Swap It</button>
    </div>
  </section>

  <div class="result-section" id="resultSection"></div>

  <script>
    const SWAP_API = 'https://api.rewovenapp.com/swap';

    // Enter key triggers swap
    document.getElementById('swapInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSwap();
    });

    // Check URL params for pre-populated query
    const urlQ = new URLSearchParams(window.location.search).get('q');
    if (urlQ) {
      document.getElementById('swapInput').value = urlQ;
      doSwap();
    }

    async function doSwap() {
      const query = document.getElementById('swapInput').value.trim();
      if (!query) return;

      const section = document.getElementById('resultSection');
      const btn = document.getElementById('swapBtn');
      btn.disabled = true;

      section.innerHTML = '<div class="loading"><div class="spinner"></div><p>Finding sustainable swaps...</p></div>';

      try {
        const res = await fetch(`${SWAP_API}/api/swap?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!res.ok) {
          section.innerHTML = `<div class="error-card"><div class="emoji">&#128533;</div><p>${esc(data.error)}</p></div>`;
          btn.disabled = false;
          return;
        }

        if (data.swap) {
          renderSwap(data);
        } else {
          renderGoodPick(data);
        }
      } catch (err) {
        section.innerHTML = '<div class="error-card"><div class="emoji">&#9888;&#65039;</div><p>Couldn\'t connect to the swap service. Try again in a moment.</p></div>';
      }

      btn.disabled = false;
    }

    function renderSwap(data) {
      const b = data.brand;
      const s = data.swap;
      const section = document.getElementById('resultSection');

      const allSwapsHTML = (data.all_swaps && data.all_swaps.length > 1) ? `
        <div class="more-swaps">
          <h3>More Sustainable Options</h3>
          ${data.all_swaps.slice(1, 5).map(a => `
            <div class="more-swap-item">
              <div>
                <div class="more-swap-name">${esc(a.name)}</div>
                <div class="more-swap-info">${esc(a.category)} &middot; ${esc(a.price_range)}</div>
              </div>
              <div class="more-swap-score">${a.overall_score}</div>
            </div>
          `).join('')}
        </div>
      ` : '';

      section.innerHTML = `
        <div class="swap-card" id="swapCard">
          <div class="swap-header">You searched for <strong>${esc(data.query)}</strong></div>
          <div class="swap-body">
            <div class="swap-brand original">
              <div class="swap-label">You bought from</div>
              <div class="swap-name">${esc(b.name)}</div>
              <div class="swap-grade ${gradeClass(b.grade)}">${esc(b.grade)}</div>
              <div class="swap-score">${b.overall_score}<small>/100</small></div>
              <div class="swap-meta">${esc(b.category)} &middot; ${esc(b.price_range)}</div>
              <div class="swap-scores">
                <div class="ss-item"><span>Environment</span><span>${b.environmental_score}</span></div>
                <div class="ss-item"><span>Labor</span><span>${b.labor_score}</span></div>
                <div class="ss-item"><span>Transparency</span><span>${b.transparency_score}</span></div>
                <div class="ss-item"><span>Animal</span><span>${b.animal_welfare_score}</span></div>
              </div>
            </div>
            <div class="swap-arrow">&#10132;</div>
            <div class="swap-brand alternative">
              <div class="swap-label">Try instead</div>
              <div class="swap-name">${esc(s.name)}</div>
              <div class="swap-grade ${gradeClass(s.grade)}">${esc(s.grade)}</div>
              <div class="swap-score">${s.overall_score}<small>/100</small></div>
              <div class="swap-meta">${esc(s.category)} &middot; ${esc(s.price_range)}</div>
              <div class="swap-scores">
                <div class="ss-item"><span>Environment</span><span>${s.environmental_score}</span></div>
                <div class="ss-item"><span>Labor</span><span>${s.labor_score}</span></div>
                <div class="ss-item"><span>Transparency</span><span>${s.transparency_score}</span></div>
                <div class="ss-item"><span>Animal</span><span>${s.animal_welfare_score}</span></div>
              </div>
            </div>
          </div>
          <div class="swap-improvement">
            <div class="big">+${data.improvement} points</div>
            <div class="sub">more sustainable</div>
          </div>
          <div class="swap-footer">
            <span>rewovenapp.com/swap</span>
            <span>Powered by Rewoven</span>
          </div>
        </div>

        <div class="share-row">
          <button class="share-btn" onclick="copyLink()">Copy Link</button>
        </div>

        ${allSwapsHTML}
      `;
    }

    function renderGoodPick(data) {
      const b = data.brand;
      document.getElementById('resultSection').innerHTML = `
        <div class="good-pick">
          <div class="emoji">&#127793;</div>
          <h2>Great choice!</h2>
          <div class="score">${b.overall_score}<small style="font-size:1rem;color:var(--gray-400)">/100</small></div>
          <p><strong>${esc(b.name)}</strong> scores well on sustainability. You're already shopping responsibly.</p>
        </div>
      `;
    }

    function gradeClass(grade) {
      if (grade.startsWith('A')) return 'grade-green';
      if (grade.startsWith('B')) return 'grade-yellow';
      if (grade.startsWith('C')) return 'grade-orange';
      return 'grade-red';
    }

    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function copyLink() {
      const query = document.getElementById('swapInput').value.trim();
      const link = `https://rewovenapp.com/swap/?q=${encodeURIComponent(query)}`;
      navigator.clipboard.writeText(link).then(() => {
        const btns = document.querySelectorAll('.share-btn');
        btns[0].textContent = 'Copied!';
        setTimeout(() => btns[0].textContent = 'Copy Link', 2000);
      });
    }

    // Theme
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    function setTheme(t) {
      html.setAttribute('data-theme', t);
      toggle.innerHTML = t === 'dark' ? '&#9728;&#65039;' : '&#127769;';
      localStorage.setItem('theme', t);
    }
    const saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);
    else setTheme('light');
    toggle.addEventListener('click', () => {
      setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // Mobile nav
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });
  </script>
</body>
</html>
