<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listen to the Rewoven Podcast on Spotify</title>
  <meta name="description" content="Listen to the Rewoven podcast on Spotify — circular fashion, sustainability, and student-led change." />

  <!-- Instant redirect for browsers that block JS -->
  <meta http-equiv="refresh" content="0; url=https://open.spotify.com/show/033GbGQsFjPEIPnBIVBtwb" />

  <!-- Canonical for crawlers -->
  <link rel="canonical" href="https://open.spotify.com/show/033GbGQsFjPEIPnBIVBtwb" />

  <link rel="icon" href="../assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F0FDF4;
      color: #064E3B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 4px 24px rgba(6, 78, 59, 0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #4B5563;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: #059669;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #047857; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #D1FAE5;
      border-top-color: #059669;
      border-radius: 50%;
      margin: 16px auto 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- JS redirect runs first when JS is enabled -->
  <script>
    window.location.replace("https://open.spotify.com/show/033GbGQsFjPEIPnBIVBtwb");
  </script>
</head>
<body>
  <div class="card">
    <img class="logo" src="../assets/logo.png" alt="Rewoven" />
    <h1>Taking you to the Rewoven podcast…</h1>
    <p>If nothing happens, tap the button below to open it on Spotify.</p>
    <a class="btn" href="https://open.spotify.com/show/033GbGQsFjPEIPnBIVBtwb">Open in Spotify</a>
    <div class="spinner" aria-hidden="true"></div>
  </div>
</body>
</html>
